<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Member Login | WAYEJIN FURFURA SHARIF</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f6f4eb;
  color:#18352d
}
.wrap{
  max-width:560px;
  margin:auto;
  padding:30px 18px
}
.card{
  background:#fff;
  padding:26px;
  border-radius:18px;
  box-shadow:0 8px 28px #0001
}
.head{
  background:#064c3c;
  color:#fff;
  margin:-26px -26px 24px;
  padding:22px 26px;
  border-radius:18px 18px 0 0
}
.head h1{
  margin:0;
  color:#d9b95b;
  font-size:28px
}
.muted{
  color:#69756f;
  font-size:13px
}
label{
  display:block;
  font-weight:700;
  margin:14px 0 7px
}
input{
  width:100%;
  padding:13px;
  border:1px solid #d8ddd9;
  border-radius:9px;
  font-size:15px
}
button{
  width:100%;
  display:block;
  margin-top:18px;
  padding:13px;
  border:0;
  border-radius:10px;
  background:#d9b95b;
  color:#18352d;
  font-size:16px;
  font-weight:800
}
button:disabled{
  opacity:.7
}
.error{
  display:none;
  background:#fff0f0;
  border:1px solid #e0aaaa;
  color:#8a2222;
  padding:12px;
  border-radius:9px;
  margin-top:15px
}
.links{
  margin-top:18px;
  text-align:center;
  font-size:13px
}
a{
  color:#0b6b52
}
</style>
</head>

<body>

<main class="wrap">
<section class="card">

<div class="head">
<h1>Member Login</h1>
<p>WAYEJIN FURFURA SHARIF</p>
</div>

<p class="muted">
শুধু APPROVED সদস্যরা Member ID এবং Registration-এর মোবাইল নম্বর দিয়ে Login করতে পারবেন।
</p>

<form id="login">

<label>Member ID *</label>
<input
  name="id"
  required
  placeholder="WBUB/WF/0007/26"
>

<label>Registered Mobile Number *</label>
<input
  name="mobile"
  type="tel"
  inputmode="numeric"
  required
  placeholder="10 সংখ্যার মোবাইল নম্বর"
>

<button id="btn" type="submit">Login</button>

</form>

<div id="error" class="error"></div>

<div class="links">
<a href="registration.html">নতুন Registration</a>
 •
<a href="verification.html">ID Verification</a>
</div>

</section>
</main>

<script src="member-config.js"></script>

<script>
const form = document.getElementById("login");
const errorBox = document.getElementById("error");
const button = document.getElementById("btn");

function digits(v){
  return String(v || "").replace(/\D/g,"").slice(-10);
}

function showError(message){
  errorBox.textContent = message;
  errorBox.style.display = "block";
}

form.addEventListener("submit", async function(e){

  e.preventDefault();

  errorBox.style.display = "none";
  button.disabled = true;
  button.textContent = "Login হচ্ছে...";

  try {

    const data = Object.fromEntries(
      new FormData(form).entries()
    );

    const id = String(data.id || "").trim();
    const mobile = digits(data.mobile);

    if(!id || !mobile){
      throw new Error("Member ID এবং মোবাইল নম্বর দিন।");
    }

    /*
      প্রথমে Member Login API চেষ্টা করবে
    */

    let response = await fetch(
      window.WEFS_MEMBER_API,
      {
        method:"POST",
        headers:{
          "Content-Type":
          "application/x-www-form-urlencoded;charset=UTF-8"
        },
        body:new URLSearchParams({
          action:"member_login",
          id:id,
          mobile:mobile
        })
      }
    );

    let result = await response.json();

    /*
      যদি POST থেকে record না আসে,
      তাহলে আপনার ইতিমধ্যে কাজ করা
      member_verify GET API ব্যবহার করবে।
    */

    if(!result.ok || !result.record){

      const verifyUrl =
        window.WEFS_MEMBER_API +
        "?action=member_verify&id=" +
        encodeURIComponent(id);

      const verifyResponse =
        await fetch(verifyUrl);

      const verifyResult =
        await verifyResponse.json();

      if(!verifyResult.found){
        throw new Error(
          verifyResult.message ||
          "Member ID পাওয়া যায়নি অথবা সদস্য APPROVED নয়।"
        );
      }

      const record =
        verifyResult.record;

      if(
        String(record.status || "").toUpperCase()
        !== "APPROVED"
      ){
        throw new Error(
          "এই সদস্য এখনও APPROVED নয়।"
        );
      }

      /*
        Registered mobile মিলিয়ে দেখা
      */

      if(
        digits(record.mobile) !== mobile
      ){
        throw new Error(
          "Member ID অথবা Registered Mobile Number সঠিক নয়।"
        );
      }

      result = {
        ok:true,
        record:record
      };
    }

    /*
      নিরাপদভাবে record পরীক্ষা
    */

    if(
      !result.record ||
      !result.record.wazeen_id
    ){
      throw new Error(
        "Member data পাওয়া যায়নি। আবার চেষ্টা করুন।"
      );
    }

    /*
      Login সফল
    */

    sessionStorage.setItem(
      "wefs_member",
      JSON.stringify(result.record)
    );

    /*
      Digital ID পেজে পাঠানো
    */

    window.location.href =
      "wazeen-id.html?id=" +
      encodeURIComponent(
        result.record.wazeen_id
      );

  } catch(error){

    showError(
      error.message ||
      "Login ব্যর্থ হয়েছে।"
    );

  } finally {

    button.disabled = false;
    button.textContent = "Login";

  }

});
</script>

</body>
</html>

<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Login | WAYEJIN FURFURA SHARIF</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f6f4eb;color:#18352d}.wrap{max-width:560px;margin:auto;padding:30px 18px}.card{background:#fff;padding:26px;border-radius:18px;box-shadow:0 8px 28px #0001}.head{background:#064c3c;color:#fff;margin:-26px -26px 24px;padding:22px 26px;border-radius:18px 18px 0 0}.head h1{margin:0;color:#d9b95b;font-size:28px}.muted{color:#69756f;font-size:13px}label{display:block;font-weight:700;margin:14px 0 7px}input{width:100%;padding:13px;border:1px solid #d8ddd9;border-radius:9px;font-size:15px}button{width:100%;display:block;margin-top:18px;padding:13px;border:0;border-radius:10px;background:#d9b95b;color:#18352d;font-size:16px;font-weight:800}.error{display:none;background:#fff0f0;border:1px solid #e0aaaa;color:#8a2222;padding:12px;border-radius:9px;margin-top:15px}.links{margin-top:18px;text-align:center;font-size:13px}a{color:#0b6b52}</style></head><body><main class="wrap"><section class="card"><div class="head"><h1>Member Login</h1><p>WAYEJIN FURFURA SHARIF</p></div><p class="muted">শুধু APPROVED সদস্যরা Member ID এবং Registration-এর মোবাইল নম্বর দিয়ে Login করতে পারবেন।</p><form id="login"><label>Member ID *</label><input name="id" required placeholder="WEFS/WZ/2026/000001"><label>Registered Mobile Number *</label><input name="mobile" type="tel" inputmode="numeric" required placeholder="10 সংখ্যার মোবাইল নম্বর"><button id="btn">Login</button></form><div id="error" class="error"></div><div class="links"><a href="registration.html">নতুন Registration</a> • <a href="verification.html">ID Verification</a></div></section></main><script src="member-config.js"></script><script>const f=document.getElementById("login"),err=document.getElementById("error"),btn=document.getElementById("btn");f.addEventListener("submit",async e=>{e.preventDefault();err.style.display="none";btn.disabled=true;btn.textContent="Login হচ্ছে...";try{const d=Object.fromEntries(new FormData(f).entries());const r=await fetch(window.WEFS_MEMBER_API,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body:new URLSearchParams({action:"member_login",...d})});const o=await r.json();if(!o.ok)throw new Error(o.message||"Login failed");sessionStorage.setItem("wefs_member",JSON.stringify(o.record));location.href="wazeen-id.html?id="+encodeURIComponent(o.record.wazeen_id)}catch(e){err.textContent=e.message;err.style.display="block"}finally{btn.disabled=false;btn.textContent="Login"}});</script></body></html>

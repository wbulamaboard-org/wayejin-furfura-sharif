<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Location Map | WAYEJIN FURFURA SHARIF</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f5f6f4;color:#18352d}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;box-shadow:0 8px 28px #0001;padding:16px}.top{display:grid;grid-template-columns:1fr 220px 130px;gap:10px;align-items:end}.top input,.top button{padding:12px;border:1px solid #d7ddd9;border-radius:9px}.top button{background:#d9b95b;font-weight:800}.map{height:65vh;min-height:430px;border-radius:14px;margin-top:14px;overflow:hidden}.list{display:grid;gap:10px;margin-top:14px}.item{border:1px solid #e1e6e3;border-radius:10px;padding:12px}.muted{color:#69756f;font-size:13px}.live{color:#14613d;font-weight:800}.stale{color:#9a6512;font-weight:800}.link{display:inline-block;margin-top:7px;color:#0b6b52}.err{color:#8a2222;font-weight:800}@media(max-width:700px){.top{grid-template-columns:1fr}.map{height:55vh;min-height:360px}}</style></head><body><main class="wrap"><section class="card"><h1>📍 WAYEJIN Live Location Map</h1><p class="muted">শুধু Admin Key দিয়ে দেখা যাবে। Marker-এর নিচে সর্বশেষ update-এর সময় ও Google Maps link থাকবে।</p><div class="top"><input id="key" type="password" placeholder="Admin Key"><input id="member" placeholder="Member ID (ঐচ্ছিক)"><button id="load">Map দেখুন</button></div><div id="msg" class="muted" style="margin-top:10px"></div><div id="map" class="map"></div><div id="list" class="list"></div></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="member-config.js"></script><script>
const map=L.map("map").setView([22.57,88.36],7);L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap contributors"}).addTo(map);let markers=[];
const key=document.getElementById("key"),member=document.getElementById("member"),msg=document.getElementById("msg"),list=document.getElementById("list");
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function ageText(sec){if(sec==null)return"সময় অজানা";if(sec<60)return"কয়েক সেকেন্ড আগে";if(sec<3600)return Math.floor(sec/60)+" মিনিট আগে";if(sec<86400)return Math.floor(sec/3600)+" ঘণ্টা আগে";return Math.floor(sec/86400)+" দিন আগে"}
async function load(){const k=key.value.trim();if(!k){msg.textContent="Admin Key দিন।";return}msg.textContent="Location লোড হচ্ছে…";try{let url=window.WEFS_MEMBER_API+"?action=location_list&admin_key="+encodeURIComponent(k);if(member.value.trim())url=window.WEFS_MEMBER_API+"?action=location_get&admin_key="+encodeURIComponent(k)+"&member_id="+encodeURIComponent(member.value.trim());const o=await (await fetch(url)).json();if(!o.ok)throw Error(o.message||"Unauthorized");let records=o.records||[];if(o.record)records=[o.record];markers.forEach(x=>map.removeLayer(x));markers=[];list.innerHTML="";if(!records.length){msg.textContent="কোনো Wazeen বর্তমানে Live Location share করছেন না।";return}const bounds=[];records.forEach(r=>{const ll=[Number(r.lat),Number(r.lng)];if(!isFinite(ll[0])||!isFinite(ll[1]))return;bounds.push(ll);const age=r.age_seconds??Math.floor((Date.now()-new Date(r.updated_at).getTime())/1000);const stale=age>180;const marker=L.marker(ll).addTo(map).bindPopup("<b>"+esc(r.name||r.member_id)+"</b><br>শেষ update: "+esc(ageText(age))+"<br>Accuracy: "+esc(Math.round(r.accuracy_m||0))+" m<br><a target='_blank' href='https://www.google.com/maps?q="+encodeURIComponent(ll[0]+","+ll[1])+"'>Google Maps-এ রাস্তা দেখুন</a>");markers.push(marker);list.innerHTML+="<div class='item'><b>"+esc(r.name||r.member_id)+"</b> <span class='"+(stale?"stale":"live")+"'>"+(stale?"শেষ update পুরোনো":"LIVE")+"</span><div class='muted'>Member ID: "+esc(r.member_id)+"<br>শেষ update: "+esc(new Date(r.updated_at).toLocaleString("bn-IN"))+"<br>Accuracy: "+esc(Math.round(r.accuracy_m||0))+" মিটার</div><a class='link' target='_blank' href='https://www.google.com/maps?q="+encodeURIComponent(ll[0]+","+ll[1])+"'>📍 Google Maps-এ রাস্তা দেখুন</a></div>"});if(bounds.length)map.fitBounds(bounds,{padding:[30,30],maxZoom:16});msg.textContent="শেষ refresh: "+new Date().toLocaleTimeString("bn-IN")+" • প্রতি ৩০ সেকেন্ডে refresh হবে";}catch(e){msg.innerHTML="<span class='err'>"+esc(e.message||"Map load failed")+"</span>"}}
document.getElementById("load").onclick=load;setInterval(()=>{if(key.value.trim())load()},30000);
</script></body></html>

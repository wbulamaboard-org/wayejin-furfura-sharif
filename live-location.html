<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WAYEJIN Live Location Map</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f5f6f4;color:#18352d}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;box-shadow:0 8px 28px #0001;padding:16px}.top{display:flex;gap:10px}.top button{padding:12px 18px;border:1px solid #d7ddd9;border-radius:9px;background:#d9b95b;font-weight:800}.map{height:65vh;min-height:430px;border-radius:14px;margin-top:14px;overflow:hidden}.list{display:grid;gap:10px;margin-top:14px}.item{border:1px solid #e1e6e3;border-radius:10px;padding:12px}.muted{color:#69756f;font-size:13px}.live{color:#14613d;font-weight:800}.stale{color:#9a6512;font-weight:800}.err{color:#8a2222;font-weight:800}@media(max-width:700px){.top{display:block}.top button{width:100%}.map{height:55vh;min-height:360px}}</style></head><body><main class="wrap"><section class="card"><h1>📍 WAYEJIN Live Location Map</h1><p class="muted">পাবলিক ম্যাপ • গোপনীয়তার জন্য অবস্থান আনুমানিক এলাকা হিসেবে দেখানো হচ্ছে।</p><div class="top"><button id="load">Live Location দেখুন</button></div><div id="msg" class="muted" style="margin-top:10px"></div><div id="map" class="map"></div><div id="list" class="list"></div></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>window.WEFS_LOCATION_API="https://script.google.com/macros/s/AKfycbwU4b_3e8r8dglJHcIqVAKk_fjWfdexUJEVKbCcv5tfkSInlOqgDwYoKwtwGSIiiJv5/exec";</script><script>
const map=L.map("map").setView([22.57,88.36],7);L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap contributors"}).addTo(map);let markers=[];const msg=document.getElementById("msg"),list=document.getElementById("list");
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function ageText(sec){if(sec==null)return"সময় অজানা";if(sec<60)return"কয়েক সেকেন্ড আগে";if(sec<3600)return Math.floor(sec/60)+" মিনিট আগে";if(sec<86400)return Math.floor(sec/3600)+" ঘণ্টা আগে";return Math.floor(sec/86400)+" দিন আগে"}
async function load(){msg.textContent="Location লোড হচ্ছে…";try{const o=await (await fetch(window.WEFS_LOCATION_API+"?action=locations",{cache:"no-store"})).json();if(!o.ok)throw Error(o.error||"Location load failed");const records=o.locations||[];markers.forEach(x=>map.removeLayer(x));markers=[];list.innerHTML="";if(!records.length){msg.textContent="কেউ বর্তমানে Live Location share করছেন না।";return}const bounds=[];records.forEach(r=>{const lat=Number(r.lat),lng=Number(r.lng);if(!isFinite(lat)||!isFinite(lng))return;const ll=[lat,lng];bounds.push(ll);const age=Number(r.age_seconds)||0,stale=age>180;const marker=L.marker(ll).addTo(map).bindPopup("<b>"+esc(r.name||"Member")+"</b><br>শেষ update: "+esc(ageText(age))+"<br>এটি আনুমানিক এলাকা।");markers.push(marker);list.innerHTML+="<div class='item'><b>"+esc(r.name||"Member")+"</b> <span class='"+(stale?"stale":"live")+"'>"+(stale?"শেষ update পুরোনো":"LIVE")+"</span><div class='muted'>শেষ update: "+esc(new Date(r.updated_at).toLocaleString("bn-IN"))+"<br>📍 আনুমানিক এলাকা</div></div>"});if(bounds.length)map.fitBounds(bounds,{padding:[30,30],maxZoom:12});msg.textContent="শেষ refresh: "+new Date().toLocaleTimeString("bn-IN")+" • প্রতি ৩০ সেকেন্ডে refresh হবে"}catch(e){msg.innerHTML="<span class='err'>"+esc(e.message||"Map load failed")+"</span>"}}
document.getElementById("load").onclick=load;setInterval(load,30000);load();
</script></body></html>

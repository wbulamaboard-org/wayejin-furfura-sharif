<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ওয়েজিন ডিরেক্টরি | WAYEJIN FURFURA SHARIF</title><style>body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;background:#fbfcfb;color:#17251f}.wrap{max-width:1000px;margin:auto;padding:20px}.top{background:#062d23;color:#e9dfc4;padding:10px;text-align:center}header{background:#073f31;color:#fff;padding:18px}.panel,.card{background:#fff;border:1px solid #e1e7e3;border-radius:16px;padding:20px;box-shadow:0 7px 22px #1231}.row{display:flex;gap:10px}.row input{flex:1;padding:12px}.btn{padding:11px 17px;border-radius:9px;background:#d7b45b;color:#17372d;font-weight:800;border:0;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#e7f4ec;color:#14613d;font-size:10px;font-weight:900}.muted{color:#69756f;font-size:13px}@media(max-width:800px){.grid{grid-template-columns:1fr}.row{flex-direction:column}.btn{width:100%}}</style></head><body><div class=top>WAYEJIN FURFURA SHARIF • ঐক্য • শিক্ষা • সমাজ সংস্কার</div><header><div class=wrap><b>অনুমোদিত ওয়েজিন</b> &nbsp; <a href=member-login.html>Member Login</a> &nbsp; <a href=verification.html>Verification</a></div></header><main class=wrap><div class=panel><div class=row><input id=q placeholder="নাম / জেলা / Wazeen ID"><button class=btn onclick=load()>Search</button></div></div><div id=list class=grid></div></main><script src=member-config.js></script><script>async function load(){list.innerHTML="<div class=panel>লোড হচ্ছে...</div>";try{const r=await fetch(window.WEFS_MEMBER_API+"?action=member_list&q="+encodeURIComponent(q.value));const o=await r.json();const a=o.records||[];list.innerHTML=a.map(x=>"<div class=card><span class=badge>APPROVED</span><h3>"+esc(x.name)+"</h3><p class=muted>"+esc(x.wazeen_id)+"<br>"+esc(x.district||"-")+" • "+esc(x.area||"-")+"</p><a class=btn href='verification.html?id="+encodeURIComponent(x.wazeen_id)+"'>Verify</a></div>").join("")||"<div class=panel>কোনো approved record নেই।</div>"}catch(e){list.innerHTML="<div class=panel>Database connection-এ সমস্যা।</div>"}}function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}load();</script></body></html>

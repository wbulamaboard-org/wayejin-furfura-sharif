<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital ID Card | WAYEJIN FURFURA SHARIF</title><style>body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f5f6f4}.wrap{max-width:760px;margin:auto;padding:24px}.card{background:#fff;border:2px solid #d7b45b;border-radius:20px;overflow:hidden;box-shadow:0 10px 35px #0002}.head{background:linear-gradient(135deg,#073f31,#052b22);color:#fff;padding:24px}.head h1{margin:0;color:#e2c879}.body{padding:24px}.grid{display:grid;grid-template-columns:1fr 150px;gap:20px}.qr{width:150px;height:150px;border:1px solid #ddd;padding:8px}.status{display:inline-block;padding:5px 10px;border-radius:99px;background:#e7f4ec;color:#14613d;font-size:11px;font-weight:900}.muted{color:#69756f}.btn{display:inline-block;padding:11px 16px;border-radius:9px;background:#d7b45b;color:#17372d;font-weight:800;text-decoration:none;border:0;margin:5px}@media(max-width:600px){.grid{grid-template-columns:1fr}.qr{margin:auto}}</style></head><body><main class="wrap"><div id="app">Digital ID লোড হচ্ছে...</div></main><script src="member-config.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>const app=document.getElementById("app"),mid=new URLSearchParams(location.search).get("id");async function load(){if(!mid){app.innerHTML="<div class=card><div class=body>Member ID দেওয়া হয়নি। <a class=btn href='member-login.html'>Member Login</a></div></div>";return}try{let r=await fetch(window.WEFS_MEMBER_API+"?action=verify&id="+encodeURIComponent(mid));let o=await r.json();if(!o.found)throw Error();let x=o.record,u=new URL("verification.html",location.href);u.searchParams.set("id",x.wazeen_id);app.innerHTML="<div class=card><div class=head><h1>WAYEJIN FURFURA SHARIF</h1><div>OFFICIAL DIGITAL MEMBER ID</div></div><div class=body><div class=grid><div><span class=status>"+esc(x.status||"VERIFIED")+"</span><h2>"+esc(x.name)+"</h2><p class=muted><b>Member ID:</b> "+esc(x.wazeen_id)+"<br><b>Application:</b> "+esc(x.application_no||"-")+"<br><b>District:</b> "+esc(x.district||"-")+"<br><b>Area:</b> "+esc(x.area||"-")+"</p></div><div id=qrcode class=qr></div></div><p class=muted>QR code স্ক্যান করলে official online verification খুলবে।</p><a class=btn href='"+u.href+"'>Online Verification</a><button class=btn onclick='print()'>Print / Save PDF</button></div></div>";new QRCode(document.getElementById("qrcode"),{text:u.href,width:134,height:134})}catch(e){app.innerHTML="<div class=card><div class=body><b>Digital ID পাওয়া যায়নি।</b><p class=muted>Member ID বা backend connection পরীক্ষা করুন।</p></div></div>"}}function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}load();</script></body></html>

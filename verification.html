<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ভেরিফিকেশন | WAYEJIN FURFURA SHARIF</title><style>body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;background:#fbfcfb;color:#17251f}.wrap{max-width:900px;margin:auto;padding:20px}.top{background:#062d23;color:#fff;padding:10px;text-align:center}header{background:#073f31;color:#fff;padding:18px}nav{float:right}section{padding:55px 0}.panel{background:#fff;border:1px solid #e1e7e3;border-radius:16px;padding:23px;box-shadow:0 7px 22px #1231}.row{display:flex;gap:10px}.row input{flex:1;padding:13px}.btn{padding:12px 18px;border:0;border-radius:9px;background:#d7b45b;font-weight:800}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#e7f4ec;color:#14613d;font-size:11px;font-weight:900}.muted{color:#69756f}@media(max-width:700px){nav{display:none}.row{flex-direction:column}}</style></head><body><div class=top>بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ • ঐক্য • শিক্ষা • সমাজ সংস্কার</div><header><div class=wrap><b>WAYEJIN FURFURA SHARIF</b><nav><a href=registration.html>নিবন্ধন</a> &nbsp; <a href=member-login.html>Member Login</a></nav></div></header><section><div class=wrap><h1>Wazeen ID Verification</h1><p class=muted>Application No অথবা Wazeen ID দিয়ে যাচাই করুন।</p><div class=panel><div class=row><input id=id placeholder="WEFS/WZ/2026/000001"><button class=btn onclick=verify()>Verify</button></div><div id=out></div></div></div></section><script src=member-config.js></script><script>async function verify(){let q=id.value.trim();if(!q)return;out.innerHTML="<div class=panel>যাচাই করা হচ্ছে...</div>";try{let r=await fetch(window.WEFS_MEMBER_API+"?action=member_verify&id="+encodeURIComponent(q));let o=await r.json();if(!o.found){out.innerHTML="<div class=panel>রেকর্ড পাওয়া যায়নি।</div>";return}let x=o.record;out.innerHTML="<div class=panel><span class=badge>APPROVED</span><h2>"+esc(x.name)+"</h2><p class=muted>Member ID: "+esc(x.wazeen_id)+"<br>Application No: "+esc(x.application_no)+"<br>District: "+esc(x.district||"-")+"<br>Area: "+esc(x.area||"-")+"</p><a class=btn href='wazeen-id.html?id="+encodeURIComponent(x.wazeen_id)+"'>Digital ID Card</a></div>"}catch(e){out.innerHTML="<div class=panel>Database connection-এ সমস্যা। Backend deployment পরীক্ষা করুন।</div>"}}function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}let p=new URLSearchParams(location.search).get("id");if(p){id.value=p;verify()}</script></body></html>

<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ওয়েজিন নিবন্ধন | WAYEJIN FURFURA SHARIF</title><style>body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f6f4eb;color:#18352d}.top{background:#064c3c;color:#fff;padding:18px}.wrap{max-width:760px;margin:auto}.title{font-size:30px;font-weight:800;color:#d9b95b}.card{background:#fff;margin:24px auto;padding:24px;border-radius:18px;box-shadow:0 8px 28px #0001}label{display:block;font-weight:700;margin:15px 0 7px}input,textarea{width:100%;padding:13px;border:1px solid #d8ddd9;border-radius:9px;font-size:15px;box-sizing:border-box}textarea{min-height:90px}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:#d9b95b;color:#18352d;font-size:17px;font-weight:800}.notice{background:#fff8df;border-left:4px solid #d9b95b;padding:12px;border-radius:8px}.success,.error{display:none;padding:15px;border-radius:10px;margin-top:18px}.success{background:#e8f7ef;border:1px solid #9dd4b5}.error{background:#fff0f0;border:1px solid #e0aaaa;color:#8a2222}.small{font-size:12px;color:#69756f;margin-top:12px}</style></head><body><header class="top"><div class="wrap"><b>WAYEJIN E-FURFURA SHARIF</b><div class="title">ওয়েজিন নিবন্ধন</div><div>Official Member Registration</div></div></header><main class="wrap"><section class="card"><h2>Member Registration</h2><div class="notice">আবেদন জমা দেওয়ার পর প্রশাসনের অনুমোদন প্রয়োজন হবে। অনুমোদনের পরে Member ID তৈরি হবে এবং Member Login থেকে Digital ID Card দেখা যাবে।</div><form id="f"><label>পূর্ণ নাম *</label><input name="name" required><label>মোবাইল নম্বর *</label><input name="mobile" required><label>জেলা *</label><input name="district" required><label>ব্লক / এলাকা *</label><input name="area" required><label>শিক্ষাগত যোগ্যতা</label><input name="education"><label>ওয়াজ / দাওয়াতের অভিজ্ঞতা</label><textarea name="experience"></textarea><label>বর্তমান ঠিকানা</label><textarea name="address"></textarea><label>Login Password *</label><input name="password" type="password" minlength="6" required><button id="b">Registration Submit করুন</button><div id="ok" class="success"></div><div id="er" class="error"></div><div class="small">Password কাউকে দেবেন না। Approval না হওয়া পর্যন্ত Login সক্রিয় হবে না।</div></form></section></main><script src="member-config.js"></script><script>const f=document.getElementById("f"),b=document.getElementById("b"),ok=document.getElementById("ok"),er=document.getElementById("er");f.onsubmit=async e=>{e.preventDefault();ok.style.display=er.style.display="none";b.disabled=true;b.textContent="জমা দেওয়া হচ্ছে...";try{const d=Object.fromEntries(new FormData(f));const r=await fetch(window.WEFS_MEMBER_API,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body:new URLSearchParams({action:"register",...d})});const o=await r.json();if(!o.ok)throw Error(o.message||"Registration failed");ok.innerHTML="<b>আবেদন সফলভাবে জমা হয়েছে।</b><br>Application No: <b>"+o.application_no+"</b>";ok.style.display="block";f.reset()}catch(x){er.textContent="Registration সম্পন্ন হয়নি: "+x.message;er.style.display="block"}finally{b.disabled=false;b.textContent="Registration Submit করুন"}};</script></body></html>

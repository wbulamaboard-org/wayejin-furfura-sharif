<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WAYEJIN — Admin Approval</title>
<style>
body{margin:0;background:#f5f3eb;font-family:Arial,sans-serif;color:#17352e}
header{background:#075b49;color:#fff;padding:18px 16px}
h1{font-size:20px;margin:0 0 5px} .sub{font-size:13px;opacity:.9}
main{max-width:720px;margin:18px auto;padding:0 12px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccd5d1;border-radius:9px;font-size:15px;margin:7px 0 10px}
button{border:0;border-radius:9px;padding:12px 16px;font-weight:700;font-size:15px;cursor:pointer}
.primary{background:#d9b653;color:#17352e}.danger{background:#eee;color:#7b2020}
.item{border:1px solid #e2e6e3;border-radius:11px;padding:13px;margin-top:10px}
.name{font-weight:700;font-size:17px}.meta{font-size:13px;line-height:1.7;margin:6px 0 10px;color:#42534e}
.msg{padding:10px;border-radius:8px;background:#eef7f3;margin-top:10px;font-size:14px}
.error{background:#fff0f0;color:#8a1d1d}
.small{font-size:12px;color:#68736f}
</style>
</head>
<body>
<header><h1>WAYEJIN E-FURFURA SHARIF</h1><div class="sub">Member Approval Panel</div></header>
<main>
<div class="card">
<label><b>Admin Key</b></label>
<input id="key" type="password" autocomplete="off" placeholder="Apps Script-এর Admin Key দিন">
<button class="primary" onclick="loadPending()">Pending Applications দেখুন</button>
<div id="msg"></div>
</div>
<div class="card">
<label><b>Search</b></label>
<input id="search" placeholder="নাম / মোবাইল / Application No.">
<div id="list"><div class="small">প্রথমে Pending Applications দেখুন।</div></div>
</div>
</main>
<script>
const API="https://script.google.com/macros/s/AKfycbyPeDxvvzwhGdIukIaQUEqZsPmXet4K-niN16XusC8z-G27PsA_pf1CzMLs9Cw6dTUqcg/exec";
let records=[];
function show(t,err=false){const e=document.getElementById('msg');e.className='msg'+(err?' error':'');e.textContent=t}
async function post(data){
 const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:new URLSearchParams(data)});
 return await r.json();
}
async function loadPending(){
 const key=document.getElementById('key').value.trim();
 if(!key){show('Admin Key দিন।',true);return}
 show('লোড হচ্ছে…');
 try{
   const x=await post({action:'pending',admin_key:key});
   if(!x.ok){show(x.message||'অনুমতি পাওয়া যায়নি।',true);return}
   records=x.records||[]; render();
   show(records.length+'টি Pending আবেদন পাওয়া গেছে।');
 }catch(e){show('API থেকে তথ্য আনা যায়নি। Admin API deployment ও access পরীক্ষা করুন।',true)}
}
function render(){
 const q=document.getElementById('search').value.trim().toLowerCase();
 const arr=records.filter(r=>!q||[r.name,r.mobile,r.application_no,r.district,r.area].join(' ').toLowerCase().includes(q));
 const box=document.getElementById('list');
 if(!arr.length){box.innerHTML='<div class="small">কোনো Pending আবেদন নেই।</div>';return}
 box.innerHTML=arr.map(r=>`
 <div class="item">
  <div class="name">${esc(r.name)}</div>
  <div class="meta">
   মোবাইল: <b>${esc(r.mobile)}</b><br>
   Application No: <b>${esc(r.application_no)}</b><br>
   জেলা: ${esc(r.district||'')} &nbsp; এলাকা: ${esc(r.area||'')}<br>
   Status: <b>${esc(r.status||'PENDING')}</b>
  </div>
  <button class="primary" onclick="approve('${escAttr(r.application_no)}',this)">✓ Approve করুন</button>
 </div>`).join('');
}
document.getElementById('search').addEventListener('input',render);
async function approve(appNo,btn){
 const key=document.getElementById('key').value.trim();
 if(!key){show('Admin Key দিন।',true);return}
 if(!confirm('এই আবেদনটি Approve করবেন?'))return;
 btn.disabled=true;btn.textContent='Approving…';
 try{
   const x=await post({action:'approve',admin_key:key,application_no:appNo});
   if(!x.ok){show(x.message||'Approval failed',true);btn.disabled=false;btn.textContent='✓ Approve করুন';return}
   show('সফল! Member ID: '+(x.member_id||'তৈরি হয়েছে'));
   records=records.filter(r=>String(r.application_no)!==String(appNo));render();
 }catch(e){show('Approval request পাঠানো যায়নি।',true);btn.disabled=false;btn.textContent='✓ Approve করুন'}
}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function escAttr(v){return esc(v)}
</script>
</body>
</html>

<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Admin | WAYEJIN FURFURA SHARIF</title><style>body{font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f5f6f4;margin:0;color:#17372d}.wrap{max-width:1000px;margin:auto;padding:20px}.panel,.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:20px;margin:15px 0}.row{display:flex;gap:10px}.row input{flex:1;padding:12px}.btn{padding:10px 14px;border:0;border-radius:8px;background:#d7b45b;font-weight:800}.danger{background:#eee}.muted{color:#68756f}.ok{color:#14613d}.err{color:#a22}@media(max-width:650px){.row{flex-direction:column}.btn{width:100%}}</style></head><body><main class="wrap"><h1>WAYEJIN Member Admin</h1><div class="panel"><p class=muted>Pending applications দেখুন এবং approve/reject করুন। Admin key backend-এ যাচাই হয়।</p><div class=row><input id=key type=password placeholder="Admin Key"><button class=btn onclick=loadPending()>Pending Applications</button></div><div id=msg></div></div><div id=list></div></main><script src="member-config.js?v=20260921-1"></script><script>async function post(action,data={}){try{const r=await fetch(window.WEFS_MEMBER_API+"?v=20260921-1",{method:"POST",cache:"no-store",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body:new URLSearchParams({action,...data})});const t=await r.text();try{return JSON.parse(t)}catch(e){return {ok:false,message:"Backend থেকে JSON response আসেনি: "+t.slice(0,200)}}}catch(e){return {ok:false,message:"Backend connection error: "+e.message}}}async function loadPending(){list.innerHTML="<div class=panel>লোড হচ্ছে...</div>";const o=await post("pending",{admin_key:key.value});if(!o.ok){list.innerHTML="<div class='panel err'>"+o.message+"</div>";return}list.innerHTML=o.records.map(x=>"<div class=card><b>"+esc(x.name)+"</b><p class=muted>"+esc(x.application_no)+" • "+esc(x.mobile)+" • "+esc(x.district)+" • "+esc(x.area)+"</p><p>"+esc(x.education||"")+"</p><button class=btn onclick='act("approve",""+esc(x.application_no)+"")'>Approve</button> <button class='btn danger' onclick='act("reject",""+esc(x.application_no)+"")'>Reject</button></div>").join("")||"<div class=panel>কোনো pending application নেই।</div>"}async function act(a,n){const o=await post(a,{admin_key:key.value,application_no:n});msg.innerHTML=o.ok?"<p class=ok>সফল: "+(o.member_id||o.status||"Done")+"</p>":"<p class=err>"+o.message+"</p>";loadPending()}function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}</script></body></html>
